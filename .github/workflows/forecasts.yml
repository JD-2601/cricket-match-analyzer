name: Update forecasts

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: python data_module/fetch_forecasts.py
      - name: Commit if changed
        run: |
          git config user.name "forecast-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/processed/forecasts.json
          git diff --cached --quiet || (git commit -m "Update forecasts" && git push)
